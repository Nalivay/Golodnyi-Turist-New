    <script>
      // Fix environment issue: "Cannot set property fetch of #<Window> which has only a getter"
      (function() {
        try {
          var originalFetch = typeof window !== 'undefined' && window.fetch ? window.fetch.bind(window) : undefined;
          var currentFetch = originalFetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return currentFetch;
            },
            set: function(val) {
              currentFetch = typeof val === 'function' ? val : originalFetch;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          // Ignore if environment prevents redefinition
        }
      })();
    </script>

<script type="module" src="/server.ts"></script>    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js?v=10', { scope: '/' })
            .then(function(reg) {
              reg.update();
              // Check for updates whenever the user switches back to the app on iOS/Android
              document.addEventListener('visibilitychange', function() {
                if (document.visibilityState === 'visible') {
                  reg.update();
                }
              });
              window.addEventListener('focus', function() {
                reg.update();
              });
              reg.addEventListener('updatefound', function() {
                var newWorker = reg.installing;
                if (newWorker) {
                  newWorker.addEventListener('statechange', function() {
                    if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                      console.log('New service worker installed, activating...');
                      window.location.reload();
                    }
                  });
                }
              });
            })
            .catch(function(err) {
              console.warn('PWA ServiceWorker registration failed:', err);
            });
        });
      }
    </script>
